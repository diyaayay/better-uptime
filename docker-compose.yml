services:
  postgres:
    image: postgres:16
    container_name: better-uptime-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-betteruptime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betteruptime}
      POSTGRES_DB: ${POSTGRES_DB:-betteruptime}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-betteruptime} -d ${POSTGRES_DB:-betteruptime}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: better-uptime-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-betteruptime}:${POSTGRES_PASSWORD:-betteruptime}@postgres:5432/${POSTGRES_DB:-betteruptime}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file (see .env.example)}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
